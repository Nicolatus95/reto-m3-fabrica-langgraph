# Reglas de ruff del repo. Son EXPLÍCITAS a propósito: los valores por defecto de ruff cambian entre versiones y la
# compuerta del revisor (flujos/revisor.py) no puede aprobar en una máquina y rechazar en otra.
# La versión de ruff está fijada en requirements.txt.
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF100"]

[lint.flake8-bugbear]
# Depends y Query de FastAPI en los argumentos por defecto son el patrón idiomático, no un B008 real
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
